# This file is included in the http context of the official nginx image.
server_tokens off;

# Requests arrive from Nginx Proxy Manager over a private Docker network. Only
# private hops are trusted when reading X-Forwarded-For, so the limits below
# apply to the real client IP and an address forged by the client is ignored.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# A first, cheap layer in front of the API's own limits: floods are rejected
# here before they reach Node.js or PostgreSQL.
limit_req_zone $binary_remote_addr zone=api_requests:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_requests:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;
limit_req_status 429;
limit_conn_status 429;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Matches the API body limit, which allows importing a full backup.
  client_max_body_size 2m;
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location = /api/auth/login {
    limit_req zone=login_requests burst=10 nodelay;
    limit_conn api_connections 10;
    proxy_pass http://api:3000;
    include /etc/nginx/snippets/api-proxy.conf;
  }
  # Password links are e-mailed: the same per-IP limit as the login keeps the
  # form from being used to flood inboxes or to guess tokens.
  location ^~ /api/auth/password-reset {
    limit_req zone=login_requests burst=10 nodelay;
    limit_conn api_connections 10;
    proxy_pass http://api:3000;
    include /etc/nginx/snippets/api-proxy.conf;
  }
  location ^~ /api/ {
    limit_req zone=api_requests burst=50 nodelay;
    limit_conn api_connections 30;
    proxy_pass http://api:3000;
    include /etc/nginx/snippets/api-proxy.conf;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:js|css|woff2|png|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }
}
